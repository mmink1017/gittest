<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 화면</title>
  </head>
  <body>
    <form class="form" action="">
      <filedset>
        <legend>로그인</legend>
        <input type="text" name="userId" id="userId" /><br />
        <input type="password" name="password" id="password" /><br />
        <input type="submit" value="로그인" />
        <input type="reset" value="취소" />
      </filedset>
      <button type="button">회원가입</button>
      <button type="button">비밀번호찾기</button>
      <button type="button">아이디찾기</button>
    </form>
    <script>
      document.querySelector("form").addEventListener("submit", async (e) => {
        e.defaultPrevent(); //기본 이벤트 차단
        const inpusts = document.querySelectorAll("form input");
        const response = await fetch(
          "http://teacherdev09.kro.kr:10002/springboot/auth/login.do",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              userId: inputs[0].value,
              password: inputs[1].value,
            }),
          },
        );
        if (!response.ok) throw new Error("에러");
        const data = await response.json();
        if (data.token) sessionStorage.setItem(JSON.stringify(data));
        else throw new Error("로그인 실패");
      });
    </script>
    <script src="js/main.js"></script>
  </body>
</html>
